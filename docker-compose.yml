services:
  python-api:
    build: ./python
    ports:
      - "8000:8000"
    volumes:
      - ./python/app:/app/app
      - chroma-data:/app/chroma_db
      - cache_HF:/root/.cache/huggingface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  
  n8n:
    image: n8nio/n8n
    ports: 
      - 5678:5678
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on: [python-api]

volumes:
  chroma-data:
  n8n-data:
  cache_HF: